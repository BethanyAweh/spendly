<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Spendly</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>

<body>
<div class="container">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand">
      <img src="../assets/spendly-logo.png" class="logo" />
      <div>
        <h1>Spendly</h1>
        <p>Save smarter • goals • groceries • subscriptions</p>
      </div>
    </div>
    <span class="pill" id="todayPill"></span>
  </div>

  <!-- NAV -->
  <div class="nav">
    <a href="#goals">Goals</a>
    <a href="#food">Food</a>
    <a href="#bills">Bills</a>
    <a href="#subs">Subscriptions</a>
  </div>

  <!-- GOALS -->
  <section id="goals" class="card">
    <h2>Savings Goal</h2>
    <div id="goalValue"></div>
    <div id="savedValue"></div>
    <div class="progress">
      <div id="goalBar"></div>
    </div>
    <p id="goalText"></p>
    <p id="tipText"></p>
  </section>

  <!-- SPENDING -->
  <section class="card">
    <canvas id="spendingChart"></canvas>
  </section>

  <!-- FOOD -->
  <section id="food" class="card">
    <h2>Fridge</h2>
    <table>
      <tbody id="foodTable"></tbody>
    </table>

    <input type="file" id="receiptInput"/>
    <p id="ocrStatus"></p>
    <pre id="ocrText"></pre>
  </section>

  <!-- BILLS -->
  <section id="bills" class="card">
    <table id="billsTable"></table>
  </section>

  <!-- SUBS -->
  <section id="subs" class="card">
    <table id="subsTable"></table>
  </section>

</div>

<script src="dashboard.js"></script>
</body>
</html>
